function requestMaster(aiId) {
    var master = aiPlayers.find(function(p) { return p.id === aiId; });
    if (!master) return;

    player.master = { id: aiId, name: master.name, realm: master.realm, stage: master.stage, intimacy: 20 };
    master.isMaster = true;

    addLog("<span class='buff'>🎉 成功拜" + master.name + "为师！获得师徒加成</span>");
    updateUI();
    showMasterTab();
}

function interactWithMaster() {
    if (player.spiritStones < 100) {
        addLog("请安需要100灵石作为礼物！");
        return;
    }
    player.spiritStones -= 100;
    player.master.intimacy = Math.min(100, player.master.intimacy + 5);

    var master = aiPlayers.find(function(p) { return p.id === player.master.id; });
    addLog("<span class='buff'>🎁 向" + master.name + "请安，亲密度+5</span>");
    showMasterTab();
}

function learnFromMaster() {
    if (player.master.intimacy < 30) {
        addLog("亲密度不足30，师父不愿传授！");
        return;
    }
    var expGain = Math.floor(50 * realms[player.realm].multiplier);
    player.qi += expGain;
    player.master.intimacy = Math.max(0, player.master.intimacy - 2);

    var master = aiPlayers.find(function(p) { return p.id === player.master.id; });
    addLog("<span class='buff'>📚 向" + master.name + "请教，获得" + expGain + "修为</span>");
    checkLevelUp();
    updateUI();
    showMasterTab();
}

function teachDisciple(discipleId) {
    var d = player.disciples.find(function(d) { return d.id === discipleId; });
    if (!d) return;

    var expGain = Math.floor(30 * realms[player.realm].multiplier);
    player.qi += expGain;
    d.intimacy = Math.min(100, d.intimacy + 3);

    var disciple = aiPlayers.find(function(p) { return p.id === discipleId; });
    addLog("<span class='buff'>📖 传授" + disciple.name + "功法，获得" + expGain + "修为，亲密度+3</span>");
    updateUI();
    showMasterTab();
}

function giveGiftToDisciple(discipleId) {
    if (player.spiritStones < 50) {
        addLog("赠礼需要50灵石！");
        return;
    }
    player.spiritStones -= 50;
    var d = player.disciples.find(function(d) { return d.id === discipleId; });
    d.intimacy = Math.min(100, d.intimacy + 5);

    var disciple = aiPlayers.find(function(p) { return p.id === discipleId; });
    addLog("<span class='buff'>🎁 赠予" + disciple.name + "资源，亲密度+5</span>");
    showMasterTab();
}

function pursuePartner(aiId) {
    var partner = aiPlayers.find(function(p) { return p.id === aiId; });
    if (!partner) return;

    if (Math.random() < 0.5) {
        player.partner = { id: aiId, name: partner.name, realm: partner.realm, stage: partner.stage, intimacy: 10, married: false };
        partner.isPartner = true;
        addLog("<span class='buff'>💕 成功与" + partner.name + "结缘！开始培养感情吧</span>");
        showPartnerTab();
    } else {
        addLog("<span class='debuff'>💔 " + partner.name + "对你尚无好感，继续努力</span>");
    }
}

function dateWithPartner() {
    if (player.spiritStones < 200) {
        addLog("约会需要200灵石！");
        return;
    }
    player.spiritStones -= 200;
    player.partner.intimacy = Math.min(100, player.partner.intimacy + 10);

    var partner = aiPlayers.find(function(p) { return p.id === player.partner.id; });
    addLog("<span class='buff'>🌹 与" + partner.name + "约会，亲密度+10</span>");
    showPartnerTab();
}

function dualCultivation() {
    if (player.partner.intimacy < 50) {
        addLog("亲密度不足50，无法进行双修！");
        return;
    }
    var expGain = Math.floor(100 * realms[player.realm].multiplier * (1 + player.partner.intimacy / 100));
    player.qi += expGain;

    var partner = aiPlayers.find(function(p) { return p.id === player.partner.id; });
    addLog("<span class='buff'>☯️ 与" + partner.name + "双修，获得" + expGain + "修为</span>");
    checkLevelUp();
    updateUI();
}

function proposeMarriage() {
    player.partner.married = true;
    var partner = aiPlayers.find(function(p) { return p.id === player.partner.id; });
    addLog("<span class='levelup'>💍 恭喜！你与" + partner.name + "正式结为道侣！双修收益大幅提升</span>");
    showPartnerTab();
}

function openStory() {
    var modal = document.getElementById('modal');
    modal.style.display = 'flex';
    var titleEl = document.getElementById('modalTitle');
    var content = document.getElementById('modalContent');
    titleEl.textContent = "📜 修仙剧情";
    var html = "";

    storyChapters.forEach(function(chapter, index) {
        if (!chapter.unlocked) {
            html += "<div style='background:#333;padding:12px;border-radius:6px;margin:8px 0;opacity:0.5;'>";
            html += "<span style='color:#888;'>🔒 " + chapter.title + " (需境界: " + realms[chapter.realmRequired].name + ")</span></div>";
        } else {
            var status = chapter.completed ? "✅" : "🔔";
            var btnStyle = chapter.completed ? "background:#22c55e;" : "background:#f59e0b;";
            html += "<div style='background:#333;padding:12px;border-radius:6px;margin:8px 0;'>";
            html += "<div style='display:flex;justify-content:space-between;align-items:center;'>";
            html += "<span>" + status + " " + chapter.title + "</span>";
            html += "<button onclick='playStory(" + index + ")' style='" + btnStyle + "'>" + (chapter.completed ? "回顾" : "开始") + "</button>";
            html += "</div></div>";
        }
    });

    html += "<button onclick='closeModal()' style='margin-top:15px;'>关闭</button>";
    content.innerHTML = html;
}

function playStory(chapterIndex) {
    var chapter = storyChapters[chapterIndex];
    if (!chapter || !chapter.unlocked) return;

    currentStoryIndex = chapterIndex;
    storyDialogueIndex = 0;
    showStoryDialogue();
}

function showStoryDialogue() {
    var chapter = storyChapters[currentStoryIndex];
    if (!chapter || storyDialogueIndex >= chapter.dialogues.length) {
        if (!chapter.completed) {
            chapter.completed = true;
            var nextChapter = storyChapters[currentStoryIndex + 1];
            if (nextChapter) {
                nextChapter.unlocked = true;
                addLog("📜 剧情解锁: " + nextChapter.title);
            }
            checkStoryUnlocks();
        }
        closeModal();
        addLog("📜 剧情结束: " + chapter.title);
        return;
    }

    var dialogue = chapter.dialogues[storyDialogueIndex];
    var modal = document.getElementById('modal');
    modal.style.display = 'flex';
    var titleEl = document.getElementById('modalTitle');
    var content = document.getElementById('modalContent');

    titleEl.textContent = "📜 " + chapter.title;
    var html = "<div style='background:#444;padding:20px;border-radius:8px;margin-bottom:15px;'>";
    html += "<div style='font-size:16px;margin-bottom:10px;color:#f59e0b;'>" + dialogue.speaker + "</div>";
    html += "<div style='font-size:14px;line-height:1.6;'>" + dialogue.text + "</div>";
    html += "</div>";
    html += "<button onclick='storyDialogueIndex++;showStoryDialogue();' style='width:100%;background:#22c55e;'>下一句</button>";

    content.innerHTML = html;
}

function checkStoryUnlocks() {
    storyChapters.forEach(function(chapter, index) {
        if (!chapter.unlocked) {
            if (player.realm >= chapter.realmRequired) {
                if (chapter.stageRequired && player.stage < chapter.stageRequired) {
                    return;
                }
                chapter.unlocked = true;
                addLog("<span class='event'>📜 剧情解锁: " + chapter.title + "</span>");
            }
        }
    });
}

function openDungeon() {
    var modal = document.getElementById('modal');
    modal.style.display = 'flex';
    var titleEl = document.getElementById('modalTitle');
    var content = document.getElementById('modalContent');
    titleEl.textContent = "🏰 副本挑战";

    var html = "";
    if (currentDungeon) {
        html += showDungeonBattle();
    } else {
        html += showDungeonList();
    }

    html += "<button onclick='closeModal()' style='margin-top:15px;'>关闭</button>";
    content.innerHTML = html;
}

function showDungeonList() {
    var html = "";
    dungeons.forEach(function(dungeon, index) {
        var locked = player.realm < dungeon.realmRequired;
        var diffColor = dungeon.difficulty === "easy" ? "#22c55e" : dungeon.difficulty === "medium" ? "#f59e0b" : dungeon.difficulty === "hard" ? "#ef4444" : "#dc2626";

        html += "<div style='background:#333;padding:12px;border-radius:6px;margin:8px 0;" + (locked ? "opacity:0.5;" : "") + "'>";
        html += "<div style='display:flex;justify-content:space-between;align-items:center;'>";
        html += "<div><b>" + dungeon.name + "</b>";
        html += "<div style='font-size:11px;color:#888;'>" + dungeon.description + "</div>";
        html += "<div style='font-size:11px;color:#aaa;'>难度: <span style='color:" + diffColor + ";'>" + dungeon.difficulty + "</span> | 层数: " + dungeon.floors + " | 推荐: " + dungeon.realmRequired + "境界" + dungeon.recommendedStage + "层</div></div>";

        if (!locked) {
            html += "<button onclick='enterDungeon(" + index + ")' style='background:#7c3aed;'>进入</button>";
        } else {
            html += "<span style='color:#666;'>🔒</span>";
        }
        html += "</div></div>";
    });
    return html;
}

function enterDungeon(dungeonIndex) {
    var dungeon = dungeons[dungeonIndex];
    if (!dungeon) return;

    currentDungeon = dungeon;
    currentDungeonFloor = 1;
    addLog("<span class='event'>🏰 进入副本: " + dungeon.name + " 第1层</span>");
    spawnDungeonMonster();
    openDungeon();
}

function spawnDungeonMonster() {
    var dungeon = currentDungeon;
    if (!dungeon) return;

    var monsterTemplate = dungeon.monsters[Math.floor(Math.random() * dungeon.monsters.length)];
    var floorBonus = currentDungeonFloor * 0.1;

    dungeonMonster = {
        name: monsterTemplate.name,
        sprite: "👹",
        hp: Math.floor(monsterTemplate.hp * (1 + floorBonus)),
        maxHp: Math.floor(monsterTemplate.hp * (1 + floorBonus)),
        atk: Math.floor(monsterTemplate.atk * (1 + floorBonus)),
        def: Math.floor(monsterTemplate.def * (1 + floorBonus)),
        exp: Math.floor(monsterTemplate.exp * (1 + floorBonus)),
        gold: Math.floor(monsterTemplate.gold * (1 + floorBonus)),
        buffs: []
    };

    addLog("🏰 第" + currentDungeonFloor + "层出现: " + dungeonMonster.name + " (HP:" + dungeonMonster.hp + ")");
    openDungeon();
}

function showDungeonBattle() {
    var dungeon = currentDungeon;
    var html = "";

    html += "<div style='background:#222;padding:15px;border-radius:8px;text-align:center;margin-bottom:15px;'>";
    html += "<div style='color:#f59e0b;margin-bottom:10px;'>🏰 " + dungeon.name + " - 第" + currentDungeonFloor + "/" + dungeon.floors + "层</div>";

    if (dungeonMonster && dungeonMonster.hp > 0) {
        html += "<div style='font-size:40px;margin:10px 0;'>👹</div>";
        html += "<div><b>" + dungeonMonster.name + "</b></div>";
        html += "<div style='margin:10px 0;'>";
        html += "<div style='width:100%;height:10px;background:#333;border-radius:5px;overflow:hidden;'>";
        html += "<div style='width:" + (dungeonMonster.hp / dungeonMonster.maxHp * 100) + "%;height:100%;background:linear-gradient(90deg,#ef4444,#f87171);'></div>";
        html += "</div>";
        html += "<div style='font-size:12px;margin-top:5px;'>生机: " + dungeonMonster.hp + "/" + dungeonMonster.maxHp + "</div>";
        html += "</div>";
        html += "<div style='display:flex;gap:8px;justify-content:center;margin-top:15px;'>";
        html += "<button onclick='dungeonAttack()' style='background:#ef4444;flex:1;'>攻击</button>";
        html += "<button onclick='dungeonFlee()' style='background:#6b7280;flex:1;'>退出</button>";
        html += "</div>";
    } else {
        html += "<div style='color:#22c55e;padding:20px;'>🎉 击败当前层怪物！</div>";
        if (currentDungeonFloor >= dungeon.floors) {
            html += "<div style='color:#fbbf24;padding:15px;'>🏆 通关副本！</div>";
            html += "<div style='font-size:12px;color:#aaa;'>";
            html += "奖励: " + dungeon.rewards.gold + "灵石, " + dungeon.rewards.exp + "修为";
            html += "</div>";
            player.spiritStones += dungeon.rewards.gold;
            player.qi += dungeon.rewards.exp;
            if (dungeon.rewards.item) {
                addItemToInventory(dungeon.rewards.item);
            }
            html += "<button onclick='exitDungeon()' style='background:#22c55e;margin-top:10px;'>领取奖励离开</button>";
        } else {
            html += "<button onclick='currentDungeonFloor++;spawnDungeonMonster();openDungeon();' style='background:#22c55e;margin-top:10px;'>下一层</button>";
        }
    }

    html += "</div>";
    return html;
}

function dungeonAttack() {
    if (!dungeonMonster) return;

    var playerAtk = getTotalAtk();
    var damage = Math.max(1, playerAtk - dungeonMonster.def);
    dungeonMonster.hp -= damage;

    addLog("⚔️ 你攻击" + dungeonMonster.name + "，造成 " + damage + " 伤害");

    if (dungeonMonster.hp <= 0) {
        addLog("🏰 击败" + dungeonMonster.name + "！");
        openDungeon();
    } else {
        var monsterDmg = Math.max(1, dungeonMonster.atk - getTotalDef());
        player.hp -= monsterDmg;
        addLog("👹 " + dungeonMonster.name + "反击，造成 " + monsterDmg + " 伤害");

        if (player.hp <= 0) {
            player.hp = 0;
            addLog("<span class='debuff'>💀 你在副本中重伤，自动退出！</span>");
            exitDungeon();
        } else {
            openDungeon();
        }
    }
    updateUI();
}

function dungeonFlee() {
    exitDungeon();
}

function exitDungeon() {
    currentDungeon = null;
    currentDungeonFloor = 0;
    dungeonMonster = null;
    closeModal();
    updateUI();
}

function showTutorial(tutorialId) {
    if (completedTutorials.indexOf(tutorialId) >= 0) return;

    var tutorial = tutorials.find(function(t) { return t.id === tutorialId; });
    if (!tutorial) return;

    completedTutorials.push(tutorialId);

    var modal = document.getElementById('modal');
    modal.style.display = 'flex';
    var titleEl = document.getElementById('modalTitle');
    var content = document.getElementById('modalContent');

    titleEl.textContent = "💡 " + tutorial.title;
    var html = "<div style='background:#444;padding:20px;border-radius:8px;text-align:center;'>";
    html += "<div style='font-size:14px;line-height:1.8;'>" + tutorial.content + "</div>";
    html += "<button onclick='closeModal();checkTutorialTriggers();' style='margin-top:20px;background:#22c55e;width:100%;'>知道了</button>";
    html += "</div>";

    content.innerHTML = html;
}

function checkTutorialTriggers() {
    if (completedTutorials.indexOf("t1") < 0) {
        showTutorial("t1");
        return;
    }

    if (player.killCount >= 1 && completedTutorials.indexOf("t2") < 0) {
        showTutorial("t2");
        return;
    }

    if (player.stage >= 3 && completedTutorials.indexOf("t3") < 0) {
        showTutorial("t3");
        return;
    }

    if (player.equipment.weapon && completedTutorials.indexOf("t4") < 0) {
        showTutorial("t4");
        return;
    }

    if (player.sect.id && completedTutorials.indexOf("t5") < 0) {
        showTutorial("t5");
        return;
    }

    if (player.residence.spiritField > 0 && completedTutorials.indexOf("t6") < 0) {
        showTutorial("t6");
        return;
    }

    if (player.realm >= 2 && completedTutorials.indexOf("t7") < 0) {
        showTutorial("t7");
        return;
    }
}

function openTutorial() {
    var modal = document.getElementById('modal');
    modal.style.display = 'flex';
    var titleEl = document.getElementById('modalTitle');
    var content = document.getElementById('modalContent');

    titleEl.textContent = "💡 新手引导";

    var html = "";
    tutorials.forEach(function(t, index) {
        var done = completedTutorials.indexOf(t.id) >= 0;
        html += "<div style='background:#333;padding:12px;border-radius:6px;margin:8px 0;'>";
        html += "<div style='display:flex;justify-content:space-between;align-items:center;'>";
        html += "<span>" + (done ? "✅" : "🔔") + " " + (index + 1) + ". " + t.title + "</span>";
        html += "<button onclick='showTutorial(\"" + t.id + "\")' style='background:#3b82f6;'>查看</button>";
        html += "</div></div>";
    });

    html += "<button onclick='checkTutorialTriggers();closeModal();' style='margin-top:15px;background:#22c55e;'>重新引导</button>";
    html += "<button onclick='closeModal()' style='margin-top:10px;'>关闭</button>";
    content.innerHTML = html;
}

}

function checkFeatureUnlocks() {
    featureUnlocks.forEach(function(feature) {
        var isUnlocked = player.realm > feature.realm || (player.realm === feature.realm && player.stage >= feature.stage);
        if (isUnlocked && !unlockedFeatures[feature.id]) {
            unlockedFeatures[feature.id] = true;
            addLog("<span class='event'>🎉 解锁新功能: " + feature.icon + feature.name + " - " + feature.desc + "</span>");
        }
        var btn = document.getElementById(feature.btnId);
        if (btn) {
            btn.style.display = isUnlocked ? 'inline-block' : 'none';
        }
    });
    updateUI();
}

initGameSystems();
startAutoSave();

var saves = JSON.parse(localStorage.getItem('rpgSaves') || '[]');
var autoSave = saves.find(function(s) { return s && s.isAuto; });
if (autoSave) {
    var data = autoSave.data;
    Object.assign(player, data.player);
    nowMonster = data.nowMonster || { buffs: [] };
    currentEvent = data.currentEvent;
    consecutiveKills = data.consecutiveKills;
    zoneKills = data.zoneKills;
    totalGoldEarned = data.totalGoldEarned;
    questCompleted = data.questCompleted;
    if (data.quests) { quests.length = 0; quests.push.apply(quests, data.quests); }
    if (data.achievements) { achievements.length = 0; achievements.push.apply(achievements, data.achievements); }
    if (data.inventory) { inventory.length = 0; inventory.push.apply(inventory, data.inventory); }
    if (data.petInventory) { petInventory.length = 0; petInventory.push.apply(petInventory, data.petInventory); }
    if (data.petKillCount) Object.assign(petKillCount, data.petKillCount);
    if (data.discoveredMonsters) Object.assign(discoveredMonsters, data.discoveredMonsters);
    if (data.gameSettings) Object.assign(gameSettings, data.gameSettings);
    if (data.storyChapters) { storyChapters.length = 0; storyChapters.push.apply(storyChapters, data.storyChapters); }
    if (data.completedTutorials) { completedTutorials = data.completedTutorials; }
    if (data.currentDungeon) currentDungeon = data.currentDungeon;
    if (data.currentDungeonFloor) currentDungeonFloor = data.currentDungeonFloor;
    var offlineGain = calculateOfflineGain();
    if (offlineGain > 0) {
        player.spiritStones += offlineGain;
        player.residence.lastCollect = Date.now();
        setTimeout(function() {
            addLog("<span class='gold'>💰 离线收益: " + offlineGain + "灵石</span>");
        }, 1000);
    }
    addLog("📂 自动读取上次的存档！", 'event');
}

updateUI();
</script>
</body>
