<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>修仙问道</title>
    
<style>
* {margin: 0; padding: 0; box-sizing: border-box; font-family: "微软雅黑";}
body {background: #222; color: #fff; padding: 15px; font-size: 14px;}
.box {max-width: 1100px; margin: 0 auto; background: #333; padding: 15px; border-radius: 8px;}
.top-bar {display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;}
.top-bar h2 {color: #ff6d36; font-size: 18px;}
.gold-exp-bar {display: flex; gap: 15px; font-size: 13px; flex-wrap: wrap;}
.zone-bar {display: flex; gap: 8px; align-items: center;}
.zone-btn {padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; background: #444; color: #aaa;}
.zone-btn.active {background: #ff6d36; color: #fff;}
.zone-btn.locked {background: #333; color: #555; cursor: not-allowed;}
.panel {display: flex; gap: 12px; margin-bottom: 12px;}
.role, .monster, .quest-panel {flex: 1; padding: 10px; background: #444; border-radius: 4px; min-width: 200px;}
.role h3, .monster h3, .quest-panel h3 {color: #ff6d36; margin-bottom: 6px; border-bottom: 1px solid #555; padding-bottom: 4px; font-size: 14px;}
.stat-row {display: flex; justify-content: space-between; padding: 2px 0; font-size: 12px;}
.stat-row .label {color: #aaa;}
.stat-row .value {color: #fff;}
.stat-row .value.hp {color: #4ade80;}
.stat-row .value.atk {color: #f87171;}
.stat-row .value.def {color: #60a5fa;}
.stat-row .value.exp {color: #facc15;}
.hp-bar {width: 100%; height: 5px; background: #222; border-radius: 3px; margin-top: 2px; overflow: hidden;}
.hp-bar-fill {height: 100%; background: linear-gradient(90deg, #4ade80, #22c55e); transition: width 0.3s;}
.hp-bar-fill.danger {background: linear-gradient(90deg, #f87171, #ef4444);}
.hp-bar-fill.mid {background: linear-gradient(90deg, #facc15, #eab308);}
.sprite-container {display: flex; justify-content: center; align-items: center; padding: 10px 0;}
.sprite {font-size: 48px; display: flex; justify-content: center; align-items: center; width: 70px; height: 70px; border-radius: 50%; background: #333; margin: 0 auto;}
.player-sprite {background: linear-gradient(135deg, #ff6d36 0%, #ff8f5a 100%); animation: float 3s ease-in-out infinite;}
.monster-sprite {background: linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%); animation: shake 2s ease-in-out infinite;}
@keyframes float {0%, 100% {transform: translateY(0);} 50% {transform: translateY(-5px);}}
@keyframes shake {0%, 100% {transform: translateX(0);} 25% {transform: translateX(-3px);} 75% {transform: translateX(3px);}}
@keyframes attack-right {0% {transform: translateX(0);} 50% {transform: translateX(30px);} 100% {transform: translateX(0);}}
@keyframes attack-left {0% {transform: translateX(0);} 50% {transform: translateX(-30px);} 100% {transform: translateX(0);}}
@keyframes damage {0%, 100% {opacity: 1;} 50% {opacity: 0.3;}}
@keyframes skill-burst {0% {transform: scale(1);filter: brightness(1);} 50% {transform: scale(1.3);filter: brightness(2) drop-shadow(0 0 10px #ff6d36);} 100% {transform: scale(1);filter: brightness(1);}}
@keyframes shield-glow {0% {box-shadow: 0 0 0 rgba(59,130,246,0);} 50% {box-shadow: 0 0 20px rgba(59,130,246,0.8);} 100% {box-shadow: 0 0 0 rgba(59,130,246,0);}}
@keyframes counter-attack {0% {transform: scale(1);} 25% {transform: scale(1.2);} 50% {transform: scale(0.9);} 75% {transform: scale(1.1);} 100% {transform: scale(1);}}
@keyframes evade {0%, 100% {transform: translateX(0);} 50% {transform: translateX(-20px);opacity: 0.5;}}
@keyframes death {0% {transform: scale(1);opacity: 1;} 50% {transform: scale(0.5);opacity: 0.5;} 100% {transform: scale(0);opacity: 0;}}
@keyframes levelup {0% {transform: scale(1);} 50% {transform: scale(1.2);text-shadow: 0 0 20px #ffd700;} 100% {transform: scale(1);}}
.sprite.attack-right {animation: attack-right 0.4s ease-in-out;}
.sprite.attack-left {animation: attack-left 0.4s ease-in-out;}
.sprite.skill-burst {animation: skill-burst 0.4s ease-out;}
.sprite.shield-glow {animation: shield-glow 0.6s ease-out;}
.sprite.counter-attack {animation: counter-attack 0.4s ease-out;}
.sprite.evade {animation: evade 0.5s ease-out;}
.monster-sprite.death {animation: death 0.6s ease-out forwards;}
.player-sprite.levelup {animation: levelup 0.8s ease-out;}
.sprite.damage {animation: damage 0.3s ease-in-out 2;}
.sprite.hurt {filter: brightness(1.5) saturate(2);}
.btn-group {margin: 12px 0; display: flex; flex-wrap: wrap; gap: 6px;}
button {padding: 6px 12px; border: none; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; font-size: 12px;}
button:hover {background: #1d4ed8;}
button:disabled {background: #555; cursor: not-allowed;}
button.skill-btn {background: #7c3aed;}
button.skill-btn:hover:not(:disabled) {background: #6d28d9;}
button.skill-btn.on-cooldown {background: #555;}
button.zone-btn {background: #374151;}
button.zone-btn:hover:not(.locked) {background: #4b5563;}
button.event-btn {background: #059669;}
button.event-btn:hover {background: #047857;}
.log {height: 150px; overflow-y: auto; background: #111; padding: 8px; border-radius: 4px; line-height: 1.6; font-size: 12px;}
.log p {margin: 1px 0;}
.log .damage {color: #f87171;}
.log .heal {color: #4ade80;}
.log .crit {color: #facc15; font-weight: bold;}
.log .dodge {color: #60a5fa;}
.log .buff {color: #c084fc;}
.log .debuff {color: #fb923c;}
.log .gold {color: #facc15;}
.log .levelup {color: #ff6d36; font-weight: bold;}
.log .event {color: #34d399;}
.log .quest {color: #f472b6;}
.log .achievement {color: #fbbf24;}
.equipment-slot {background: #333; padding: 5px 8px; border-radius: 4px; margin: 3px 0; display: flex; justify-content: space-between; align-items: center; font-size: 11px;}
.equipment-slot .slot-name {color: #aaa;}
.equipment-slot .item-name {color: #fff;}
.equipment-slot .item-stats {color: #4ade80; font-size: 10px;}
.buff-debuff-bar {display: flex; gap: 6px; margin-top: 6px; min-height: 20px; flex-wrap: wrap;}
.buff-item, .debuff-item {padding: 2px 6px; border-radius: 10px; font-size: 10px;}
.buff-item {background: #166534; color: #fff;}
.debuff-item {background: #991b1b; color: #fff;}
.section-title {font-size: 11px; color: #aaa; margin: 6px 0 3px 0;}
.quest-list {font-size: 11px; max-height: 120px; overflow-y: auto;}
.quest-item {background: #333; padding: 6px; border-radius: 4px; margin: 4px 0;}
.quest-item.completed {opacity: 0.6; text-decoration: line-through;}
.quest-item .quest-name {color: #f472b6; margin-bottom: 2px;}
.quest-item .quest-desc {color: #aaa; font-size: 10px;}
.quest-item .quest-reward {color: #facc15; font-size: 10px;}
.quest-item .quest-progress {color: #60a5fa; font-size: 10px;}
.achievement-bar {display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;}
.achieve-item {background: #333; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer;}
.achieve-item.unlocked {background: #78350f; color: #fbbf24;}
.achieve-item.locked {background: #222; color: #555;}

@media (max-width: 768px) {
    body {padding: 20px; font-size: 22px;}
    .box {padding: 24px; border-radius: 12px;}
    .panel {flex-direction: column;}
    .role, .monster, .quest-panel {min-width: unset; flex: none; padding: 16px;}
    .bottom-panels {flex-direction: column;}
    .sprite {font-size: 80px; width: 120px; height: 120px;}
    .btn-group {flex-direction: column; gap: 10px;}
    .btn-group button {width: 100%; padding: 20px; font-size: 22px;}
    .log {height: 180px; font-size: 18px;}
    .top-bar {flex-direction: column; align-items: flex-start; gap: 12px;}
    .gold-exp-bar {font-size: 20px; gap: 20px;}
    .zone-bar {flex-wrap: wrap; gap: 10px;}
    .zone-btn {padding: 14px 24px; font-size: 18px;}
    .role h3, .monster h3, .quest-panel h3 {font-size: 26px;}
    .stat-row {font-size: 20px; padding: 6px 0;}
    .hp-bar {height: 14px;}
    .equipment-slot {padding: 10px 14px; margin: 6px 0;}
}

@media (max-width: 480px) {
    body {padding: 16px; font-size: 20px;}
    .box {padding: 20px; border-radius: 10px;}
    .role h3, .monster h3, .quest-panel h3 {font-size: 24px;}
    .stat-row {font-size: 18px;}
    .equipment-slot {font-size: 17px; padding: 10px 12px;}
    .quest-list {max-height: 140px;}
    .btn-group button {padding: 18px; font-size: 20px;}
    .sprite {font-size: 72px; width: 100px; height: 100px;}
    .log {height: 150px; font-size: 17px;}
}
.achieve-item:hover {opacity: 0.8;}
.modal-overlay {position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000;}
.modal {background: #333; padding: 20px; border-radius: 8px; min-width: 300px; max-width: 500px;}
.modal h3 {color: #ff6d36; margin-bottom: 12px;}
.modal p {margin: 8px 0; font-size: 13px;}
.modal-buttons {display: flex; gap: 10px; margin-top: 15px;}
.modal-buttons button {flex: 1;}
.leaderboard {font-size: 12px;}
.leaderboard-item {display: flex; justify-content: space-between; padding: 6px; background: #222; margin: 4px 0; border-radius: 4px;}
.leaderboard-item .rank {color: #facc15; width: 30px;}
.leaderboard-item .name {color: #fff; flex: 1;}
.leaderboard-item .score {color: #60a5fa;}
.bottom-panels {display: flex; gap: 12px; margin-top: 12px;}
.bottom-panels > div {flex: 1; background: #444; padding: 10px; border-radius: 4px;}
.event-panel h4, .achieve-panel h4 {color: #ff6d36; font-size: 13px; margin-bottom: 8px;}
.event-btns {display: flex; gap: 8px; flex-wrap: wrap;}
.mini-stat {font-size: 11px; color: #aaa;}
.mini-stat span {color: #fff;}
.inventory-panel {margin-top: 8px;}
.inventory-item {background: #333; padding: 6px; border-radius: 4px; margin: 4px 0; display: flex; justify-content: space-between; align-items: center; font-size: 11px;}
.inventory-item .item-name {color: #fff;}
.inventory-item .item-desc {color: #aaa; font-size: 10px;}
.inventory-item .item-count {color: #fbbf14; background: #444; padding: 2px 6px; border-radius: 4px;}
.inventory-item .item-use {padding: 2px 8px; font-size: 10px; background: #2563eb;}
.settings-row {display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #444;}
.settings-row:last-child {border-bottom: none;}
.settings-label {color: #aaa; font-size: 13px;}
.toggle-switch {position: relative; width: 44px; height: 22px; background: #444; border-radius: 11px; cursor: pointer; transition: background 0.3s;}
.toggle-switch.active {background: #ff6d36;}
.toggle-switch::after {content: ''; position: absolute; width: 18px; height: 18px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: left 0.3s;}
.toggle-switch.active::after {left: 24px;}
.speed-select {background: #444; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer;}
.monster-book {display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; padding: 4px;}
.monster-card {background: #333; padding: 8px; border-radius: 4px; text-align: center; font-size: 11px;}
.monster-card.discovered {border: 1px solid #ff6d36;}
.monster-card.undiscovered {opacity: 0.4;}
.monster-card .m-icon {font-size: 24px; margin-bottom: 4px;}
.monster-card .m-name {color: #fff; margin-bottom: 2px;}
.monster-card .m-zone {color: #888; font-size: 10px;}
.compendium-tab {display: flex; gap: 6px; margin-bottom: 10px;}
.compendium-tab button {flex: 1; padding: 6px; font-size: 11px;}
.compendium-tab button.active {background: #ff6d36;}
</style>
</head>
<body>
    <div class="box">
        <div class="top-bar">
            <h2>⚔️ 修仙问道</h2>
            <div class="gold-exp-bar">
                <span>💎 <b id="spiritStones">0</b></span>
                <span>☯️ <b id="qi">0</b>/<b id="needQi">100</b></span>
                <span id="realmDisplay">🏷️ <b id="realm">炼气期·一层</b></span>
                <span id="skillPointsDisplay" style="display:none;">🌟 悟道点: <b id="skillPoints">0</b></span>
                <span id="petDisplay" style="display:none;">🐾 <b id="petName"></b></span>
                <span id="sectDisplay" style="display:none;">🏛️ <b id="sectName"></b> <span style="font-size:10px;color:#fbbf24;" id="sectRank"></span></span>
                <span class="mini-stat">斩妖: <span id="killCount">0</span></span>
                <span class="mini-stat">奇遇: <span id="eventCount">0</span></span>
            </div>
        </div>

        <div class="zone-bar">
            <span style="font-size:12px;color:#aaa;">地图:</span>
            <button class="zone-btn active" onclick="switchZone(0)" id="zoneBtn0">🌳 青云山脉</button>
            <button class="zone-btn" onclick="switchZone(1)" id="zoneBtn1">🌿 万兽谷</button>
            <button class="zone-btn" onclick="switchZone(2)" id="zoneBtn2">🕳️ 幽冥洞窟</button>
            <button class="zone-btn" onclick="switchZone(3)" id="zoneBtn3">🌋 赤焰火山</button>
            <button class="zone-btn" onclick="switchZone(4)" id="zoneBtn4">❄️ 极寒冰原</button>
            <button class="zone-btn" onclick="switchZone(5)" id="zoneBtn5">🏰 魔域</button>
            <button class="zone-btn" onclick="switchZone(6)" id="zoneBtn6">☁️ 仙界遗迹</button>
            <button class="zone-btn" onclick="switchZone(7)" id="zoneBtn7">👹 天劫之地</button>
        </div>

        <div class="panel">
            <div class="role">
                <h3>🧙 主角</h3>
                <div class="sprite-container">
                    <div class="sprite player-sprite" id="playerSprite">👸</div>
                </div>
                <div class="title-display" id="titleDisplay" style="text-align:center;color:#fbbf24;font-size:11px;margin-bottom:5px;display:none;"></div>
                <div class="stat-row"><span class="label">生机</span><span class="value hp" id="hp">100/100</span></div>
                <div class="hp-bar"><div class="hp-bar-fill" id="hpBar" style="width:100%"></div></div>
                <div class="stat-row"><span class="label">攻击</span><span class="value atk" id="atk">15</span> <span class="label" id="atkBonus" style="color:#4ade80"></span></div>
                <div class="stat-row"><span class="label">防御</span><span class="value def" id="def">5</span> <span class="label" id="defBonus" style="color:#4ade80"></span></div>
                <div class="stat-row"><span class="label">暴击率</span><span class="value" id="crit">5</span>%</div>
                <div class="stat-row"><span class="label">闪避率</span><span class="value" id="dodge">5</span>%</div>
                <div class="stat-row"><span class="label">速度</span><span class="value" id="speed">10</span></div>
                <div class="buff-debuff-bar" id="playerBuffs"></div>
                <div class="section-title">装备栏</div>
                <div class="equipment-slot" id="weaponSlot"><span class="slot-name">⚔️ 武器</span><span class="item-name">无</span></div>
                <div class="equipment-slot" id="armorSlot"><span class="slot-name">🛡️ 防具</span><span class="item-name">无</span></div>
                <div class="equipment-slot" id="accessorySlot"><span class="slot-name">💍 灵饰</span><span class="item-name">无</span></div>
            </div>

            <div class="monster">
                <h3>👹 野生妖兽</h3>
                <div class="sprite-container">
                    <div class="sprite monster-sprite" id="monsterSprite">👹</div>
                </div>
                <div class="stat-row"><span class="label">名称</span><span class="value" id="mName">---</span></div>
                <div class="stat-row"><span class="label">境界</span><span class="value" id="mLv">---</span></div>
                <div class="stat-row"><span class="label">生机</span><span class="value hp" id="mHp">0/0</span></div>
                <div class="hp-bar"><div class="hp-bar-fill" id="mHpBar" style="width:0%"></div></div>
                <div class="stat-row"><span class="label">攻击</span><span class="value atk" id="mAtk">0</span></div>
                <div class="stat-row"><span class="label">防御</span><span class="value def" id="mDef">0</span></div>
                <div class="stat-row"><span class="label">速度</span><span class="value" id="mSpeed">0</span></div>
                <div class="buff-debuff-bar" id="monsterBuffs"></div>
            </div>

            <div class="quest-panel">
                <h3>📜 任务</h3>
                <div class="quest-list" id="questList"></div>
                <div class="section-title" style="margin-top:10px;">🏆 成就</div>
                <div class="achievement-bar" id="achieveBar"></div>
            </div>
        </div>

        <div class="btn-group">
            <button onclick="attack()">🗡️ 御剑术</button>
            <button onclick="useSkill(0)" id="skill0Btn" class="skill-btn">🔥 火球术</button>
            <button onclick="useSkill(1)" id="skill1Btn" class="skill-btn">🛡️ 金刚罩</button>
            <button onclick="useSkill(2)" id="skill2Btn" class="skill-btn">⚔️ 御剑诀</button>
            <button onclick="summonPet()" id="summonPetBtn" style="background:#9333ea;">🐾 召唤灵宠</button>
            <button onclick="heal()">💊 服用丹药</button>
            <button onclick="run()">🏃 遁走</button>
            <button onclick="newMonster()">🔍 寻找妖兽</button>
            <button onclick="tryBottleneckBreakthrough()" id="breakthroughBtn" style="background:#f59e0b; display: none;">🌀 突破瓶颈</button>
            <button onclick="toggleMeditation()" id="meditationBtn" style="background:#3b82f6;">🧘 打坐修炼</button>
            <button onclick="openStory()" id="storyBtn" style="background:#8b5cf6; display:none;">📜 剧情</button>
            <button onclick="openDungeon()" id="dungeonBtn" style="background:#7c3aed; display:none;">🏰 副本</button>
            <button onclick="openSpiritRoot()" id="spiritRootBtn" style="background:#ec4899; display:none;">🧬 灵根</button>
            <button onclick="openShop()">🏪 坊市</button>
            <button onclick="openEquipShop()">🛒 法宝阁</button>
            <button onclick="openEquipmentEnhance()" id="equipmentBtn" style="display:none;">🔨 炼器</button>
            <button onclick="openAlchemy()" id="alchemyBtn" style="display:none;">⚗️ 炼丹</button>
            <button onclick="triggerRandomEvent()" class="event-btn" id="eventBtn">🎲 奇遇</button>
            <button onclick="openLeaderboard()">📊 天榜</button>
            <button onclick="openSaveLoad()">💾 存档</button>
            <button onclick="openSettings()">⚙️ 设置</button>
            <button onclick="openInventory()">🎒 储物袋</button>
            <button onclick="openMonsterBook()">📖 妖兽图鉴</button>
            <button onclick="openSkillTree()">🌳 功法</button>
            <button onclick="openPetManagement()" id="petBtn" style="display:none;">🐾 灵宠</button>
            <button onclick="openPetGacha()" id="petGachaBtn" style="display:none;">🎰 灵宠召唤</button>
            <button onclick="openSect()" id="sectBtn" style="display:none;">🏛️ 宗门</button>
            <button onclick="openResidence()" id="residenceBtn" style="display:none;">🏠 洞府</button>
            <button onclick="openSocial()" id="socialBtn" style="display:none;">🤝 仙缘</button>
        </div>

        <div class="log" id="log">修仙之路开启！点击【寻找妖兽】开始历练</div>

        <div class="bottom-panels">
            <div class="event-panel">
                <h4>🎭 当前奇遇</h4>
                <div id="currentEvent" style="font-size:12px;color:#aaa;">无</div>
                <div class="event-btns" id="eventBtns" style="margin-top:8px;display:none;">
                    <button onclick="confirmEvent()" id="eventConfirmBtn">确认</button>
                    <button onclick="cancelEvent()">取消</button>
                </div>
            </div>
            <div class="achieve-panel">
                <h4>🎯 已解锁成就</h4>
                <div id="unlockedAchieves" style="font-size:11px;color:#aaa;">暂无成就</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal" id="modalContent"></div>
    </div>

    
    
<script>
const player = {
    realm: 0, realmName: "炼气期", stage: 1,
    hp: 120, maxHp: 120, atk: 18, def: 6, speed: 10,
    qi: 0, needQi: 100, spiritStones: 100,
    crit: 8, dodge: 5,
    spiritRoot: "five", spiritRootQuality: 0, spiritRootAwakening: 0, rerollCount: 0,
    equipment: { weapon: null, armor: null, accessory: null },
    buffs: [],
    skills: [
        { name: "火球术", desc: "造成1.5倍伤害", cd: 0, maxCd: 2, isReady: true },
        { name: "金刚罩", desc: "防御+10", cd: 0, maxCd: 3, isReady: true },
        { name: "御剑诀", desc: "连攻2次", cd: 0, maxCd: 4, isReady: true }
    ],
    currentZone: 0,
    killCount: 0,
    eventCount: 0,
    bossDefeated: 0,
    pet: { id: "spiritFox", name: "灵狐", sprite: "🦊", atk: 3, hp: 40, def: 3, speed: 5, rarity: "common" },
    skillPoints: 0,
    equipmentEnhanceLevels: { weapon: 0, armor: 0, accessory: 0 },
    learnedSkills: ["火球术", "金刚罩", "御剑诀"],
    titles: [],
    alchemy: { level: 1, exp: 0 },
    forging: { level: 1, exp: 0 },

function getSpiritRootBonus() {
    var root = spiritRoots.find(function(r) { return r.id === player.spiritRoot; }) || spiritRoots[5];
    var quality = spiritRootQualities[player.spiritRootQuality] || spiritRootQualities[0];
    var awakening = spiritRootAwakenings[player.spiritRootAwakening] || spiritRootAwakenings[0];

    var baseBonus = {
        atk: 1 + root.atkBonus * quality.multiplier,
        def: 1 + root.defBonus * quality.multiplier,
        hp: 1 + root.hpBonus * quality.multiplier,
        qi: 1 + root.qiBonus * quality.multiplier
    };

    return {
        atkBonus: Math.floor(player.atk * (baseBonus.atk - 1) + awakening.atkBonus),
        defBonus: Math.floor(player.def * (baseBonus.def - 1) + awakening.defBonus),
        hpBonus: Math.floor(player.maxHp * (baseBonus.hp - 1) + awakening.hpBonus),
        qiBonus: awakening.qiBonus
    };
}

function rerollSpiritRoot() {
    var cost = 1000 * Math.pow(2, player.rerollCount || 0);
    if (player.spiritStones < cost) {
        return addLog("需要 " + cost + " 灵石才能重塑灵根！");
    }
    player.spiritStones -= cost;
    player.rerollCount = (player.rerollCount || 0) + 1;

    var rand = Math.random();
    var cumChance = 0;
    var qualityIndex = 0;
    for (var i = 0; i < spiritRootQualities.length; i++) {
        cumChance += spiritRootQualities[i].chance;
        if (rand < cumChance) {
            qualityIndex = i;
            break;
        }
    }

    var rootIndex = Math.floor(Math.random() * (spiritRoots.length - 1));
    player.spiritRoot = spiritRoots[rootIndex].id;
    player.spiritRootQuality = qualityIndex;
    player.spiritRootAwakening = 0;

    addLog("🎲 重塑灵根成功！获得【" + spiritRootQualities[qualityIndex].name + spiritRoots[rootIndex].name + "】！", 'event');
    updateUI();
}

function awakenSpiritRoot() {
    var currentAwakening = player.spiritRootAwakening || 0;
    if (currentAwakening >= spiritRootAwakenings.length - 1) {
        return addLog("灵根已经觉醒到最高层次！");
    }

    var nextAwakening = spiritRootAwakenings[currentAwakening + 1];
    if (player.spiritStones < nextAwakening.cost) {
        return addLog("需要 " + nextAwakening.cost + " 灵石才能觉醒！");
    }

    player.spiritStones -= nextAwakening.cost;
    player.spiritRootAwakening = currentAwakening + 1;

    addLog("✨ 灵根觉醒成功！进入【" + nextAwakening.name + "】层次！", 'buff');
    updateUI();
}

const bottleneckStages = [3, 6, 9];

function isBottleneckStage(stage) {
    return bottleneckStages.indexOf(stage) >= 0;
}

function getBreakthroughSuccessRate(realm, stage, isRealmBreakthrough) {
    var baseRate = isRealmBreakthrough ? 60 : 80;
    var realmPenalty = realm * 3;
    var stageBonus = isRealmBreakthrough ? 0 : (stage === 9 ? -10 : 0);
    return Math.max(20, Math.min(95, baseRate - realmPenalty + stageBonus));
}

function getTribulationDifficulty(realm) {
    return {
        hp: 200 + realm * 100,
        atk: 30 + realm * 15,
        def: 10 + realm * 5,
        speed: 15 + realm * 3,
        exp: 100 + realm * 50,
        gold: 50 + realm * 30
    };
}

var logDom = document.getElementById('log');

function addLog(text, type) {
    var p = document.createElement('p');
    p.innerHTML = text;
    if (type) p.className = type;
    logDom.appendChild(p);
    logDom.scrollTop = logDom.scrollHeight;
}

function getBattleDelay(base, extra) {
    var delay = (extra || 0) + base;
    var speed = gameSettings.battleSpeed || 1;
    return Math.max(50, delay / speed);
}

function getTotalAtk() {
    var atk = player.atk;
    if (player.equipment.weapon) atk += player.equipment.weapon.atk;
    atk += (player.equipmentEnhanceLevels.weapon || 0) * 2;
    if (petSummoned && player.pet) atk += player.pet.atk + petEnergyBoost;
    var rootBonus = getSpiritRootBonus();
    atk += rootBonus.atkBonus;
    if (player.sect.id) {
        var sect = sects.find(function(s) { return s.id === player.sect.id; });
        var rankData = sectRanks.find(function(r) { return r.name === player.sect.rank; });
        if (sect && sect.benefits.atkBonus) atk = Math.floor(atk * (1 + sect.benefits.atkBonus * rankData.benefit));
    }
    if (player.master.id) atk = Math.floor(atk * (1 + masterBenefits.atkBonus));
    if (player.partner.id) atk = Math.floor(atk * (1 + partnerBenefits.atkBonus));
    return atk;
}

function getTotalDef() {
    var def = player.def;
    if (player.equipment.armor) def += player.equipment.armor.def;
    def += (player.equipmentEnhanceLevels.armor || 0) * 2;
    if (player.pet) def += player.pet.def;
    var rootBonus = getSpiritRootBonus();
    def += rootBonus.defBonus;
    if (player.learnedSkills.indexOf("不动如山") >= 0) def = Math.floor(def * 1.15);
    if (player.sect.id) {
        var sect = sects.find(function(s) { return s.id === player.sect.id; });
        var rankData = sectRanks.find(function(r) { return r.name === player.sect.rank; });
        if (sect && sect.benefits.defBonus) def = Math.floor(def * (1 + sect.benefits.defBonus * rankData.benefit));
    }
    if (player.master.id) def = Math.floor(def * (1 + masterBenefits.defBonus));
    return def;
}

function getTotalCrit() {
    var crit = player.crit;
    if (player.equipment.weapon && player.equipment.weapon.crit) crit += player.equipment.weapon.crit;
    if (player.equipment.accessory && player.equipment.accessory.crit) crit += player.equipment.accessory.crit;
    if (player.sect.id) {
        var sect = sects.find(function(s) { return s.id === player.sect.id; });
        var rankData = sectRanks.find(function(r) { return r.name === player.sect.rank; });
        if (sect && sect.benefits.critBonus) crit += sect.benefits.critBonus * rankData.benefit;
    }
    return crit;
}

function getTotalDodge() {
    var dodge = player.dodge;
    if (player.equipment.armor && player.equipment.armor.dodge) dodge += player.equipment.armor.dodge;
    if (player.equipment.accessory && player.equipment.accessory.dodge) dodge += player.equipment.accessory.dodge;
    if (player.learnedSkills.indexOf("疾风") >= 0) dodge += 10;
    return dodge;
}

function getTotalSpeed() {
    var speed = player.speed || 10;
    if (player.equipment.accessory && player.equipment.accessory.speed) speed += player.equipment.accessory.speed;
    if (player.sect.id) {
        var sect = sects.find(function(s) { return s.id === player.sect.id; });
        var rankData = sectRanks.find(function(r) { return r.name === player.sect.rank; });
        if (sect && sect.benefits.speedBonus) speed += sect.benefits.speedBonus * rankData.benefit;
    }
    return speed;
}

function getTotalMaxHp() {
    var maxHp = player.maxHp;
    if (player.equipment.armor && player.equipment.armor.maxHp) maxHp += player.equipment.armor.maxHp;
    if (player.equipment.accessory && player.equipment.accessory.maxHp) maxHp += player.equipment.accessory.maxHp;
    maxHp += (player.equipmentEnhanceLevels.armor || 0) * 10;
    if (player.pet) maxHp += player.pet.hp;
    var rootBonus = getSpiritRootBonus();
    maxHp += rootBonus.hpBonus;
    if (player.sect.id) {
        var sect = sects.find(function(s) { return s.id === player.sect.id; });
        var rankData = sectRanks.find(function(r) { return r.name === player.sect.rank; });
        if (sect && sect.benefits.hpBonus) maxHp = Math.floor(maxHp * (1 + sect.benefits.hpBonus * rankData.benefit));
    }
    if (player.partner.id) maxHp = Math.floor(maxHp * (1 + partnerBenefits.hpBonus));
    return maxHp;
}

function updateQuests() {
    player.zoneKills = zoneKills;
    player.totalGoldEarned = totalGoldEarned;
    player.questCompleted = questCompleted;

    quests.forEach(function(q) {
        if (q.isGoldQuest) {
            q.progress = player.spiritStones;
        } else if (q.isBossQuest) {
            q.progress = player.bossDefeated;
        } else if (q.zone === -1) {
            q.progress = consecutiveKills;
        } else if (q.zone === -2) {
            q.progress = player.killCount;
        } else if (q.zone !== undefined) {
            q.progress = zoneKills[q.zone] || 0;
        }
    });

    var questList = document.getElementById('questList');
    questList.innerHTML = quests.map(function(q) {
        var canComplete = q.progress >= q.target && !q.completed;
        var rewardText = [];
        if (q.reward.gold) rewardText.push(q.reward.gold + "灵石");
        if (q.reward.exp) rewardText.push(q.reward.exp + "修为");
        if (q.reward.atk) rewardText.push("攻击+" + q.reward.atk);
        if (q.reward.def) rewardText.push("防御+" + q.reward.def);
        if (q.reward.crit) rewardText.push("暴击+" + q.reward.crit + "%");
        if (q.reward.dodge) rewardText.push("闪避+" + q.reward.dodge + "%");
        if (q.reward.hp) rewardText.push("生机+" + q.reward.hp);

        return "<div class=\"quest-item " + (q.completed ? 'completed' : '') + "\">" +
            "<div class=\"quest-name\">" + q.name + (canComplete ? "<button onclick=\"claimQuest('" + q.id + "')\" style=\"padding:2px 6px;font-size:10px;background:#22c55e;\">领取</button>" : '') + "</div>" +
            "<div class=\"quest-desc\">" + q.desc + "</div>" +
            "<div class=\"quest-progress\">进度: " + Math.min(q.progress, q.target) + "/" + q.target + "</div>" +
            "<div class=\"quest-reward\">奖励: " + rewardText.join(', ') + "</div>" +
            "</div>";
    }).join('');
}

function claimQuest(qid) {
    var q = quests.find(function(q) { return q.id === qid; });
    if (!q || q.completed || q.progress < q.target) return;

    q.completed = true;
    questCompleted++;

    if (q.reward.gold) {
        player.spiritStones += q.reward.gold;
        totalGoldEarned += q.reward.gold;
    }
    if (q.reward.exp) {
        player.qi += q.reward.exp;
        checkLevelUp();
    }
    if (q.reward.atk) player.atk += q.reward.atk;
    if (q.reward.def) player.def += q.reward.def;
    if (q.reward.crit) player.crit += q.reward.crit;
    if (q.reward.dodge) player.dodge += q.reward.dodge;
    if (q.reward.hp) {
        player.maxHp += q.reward.hp;
        player.hp += q.reward.hp;
    }

    addLog("📜 任务【" + q.name + "】完成！奖励已发放！", 'quest');
    checkAchievements();
    updateUI();
}

function checkAchievements() {
    achievements.forEach(function(a) {
        if (!a.unlocked && a.condition(player)) {
            a.unlocked = true;
            if (a.reward.gold) {
                player.spiritStones += a.reward.gold;
                totalGoldEarned += a.reward.gold;
            }
            if (a.reward.exp) {
                player.qi += a.reward.exp;
                checkLevelUp();
            }
            if (a.reward.atk) player.atk += a.reward.atk;
            if (a.reward.def) player.def += a.reward.def;
            if (a.reward.crit) player.crit += a.reward.crit;
            if (a.reward.dodge) player.dodge += a.reward.dodge;
            if (a.reward.hp) {
                player.maxHp += a.reward.hp;
                player.hp += a.reward.hp;
            }
            if (a.reward.item) {
                addItemToInventory(a.reward.item);
                var itemData = items.find(function(i) { return i.id === a.reward.item; });
                addLog("🎁 获得道具【" + itemData.name + "】！", 'event');
            }
            if (a.title && player.titles.indexOf(a.title) < 0) {
                player.titles.push(a.title);
                addLog("🎖️ 获得称号【" + a.title + "】！", 'buff');
            }
            addLog("🏆 成就解锁【" + a.name + "】：" + a.desc + "！奖励已发放！", 'achievement');
        }
    });
}

function newMonster() {
    if (player.meditation.active) {
        stopMeditation();
        addLog("⚠️ 进入斗法，自动停止打坐！");
    }

    var zone = zones[player.currentZone];
    var rand = Math.floor(Math.random() * zone.monsters.length);
    var template = zone.monsters[rand];
    var levelBonus = Math.max(0, player.realm - zone.unlockLevel);
    var monsterLevel = zone.unlockLevel + levelBonus;

    nowMonster = {
        name: template.name,
        sprite: template.sprite || "👹",
        hp: template.hp + levelBonus * 20,
        maxHp: template.hp + levelBonus * 20,
        atk: template.atk + levelBonus * 3,
        def: template.def + levelBonus * 2,
        exp: template.exp,
        gold: template.gold,
        speed: template.speed || 5,
        zoneLevel: monsterLevel,
        buffs: [],
        tempDefBoost: 0,
        highDodge: template.highDodge
    };
    battleUsedSkills = { secondWind: false, secondLife: false };
    petSummoned = false;
    petEnergyBoost = 0;
    battleActive = true;
    battleNextAction = getTotalSpeed() >= nowMonster.speed ? 'player' : 'monster';
    var initDelay = getBattleDelay(800);
    setTimeout(function() {
        addLog("⚔️ 斗法开始！");
        processAutoBattle();
    }, initDelay);
    updateUI();
}

var battleActive = false;
var battleNextAction = 'player';
var battleTimer = null;
var battlePaused = false;

function processAutoBattle() {
    if (!battleActive || battlePaused || !nowMonster.name) return;
    
    if (battleNextAction === 'player') {
        doPlayerAttack();
        battleNextAction = 'monster';
    } else {
        doMonsterAttack();
        battleNextAction = 'player';
    }
}

function doPlayerAttack() {
    if (!battleActive || !nowMonster.name || nowMonster.hp <= 0) return;
    
    processBuffs(nowMonster, true);
    if (player.hp <= 0) return;
    
    var tempDefBoost = 0;
    player.buffs = player.buffs.filter(function(b) {
        if (b.name === '金钟罩') {
            if (b.shieldCount && b.shieldCount > 0) {
                b.shieldCount--;
                if (b.shieldCount <= 0) {
                    addLog("🛡️ 护体罡气消耗完毕！", 'buff');
                    return false;
                }
                addLog("🛡️ 护体罡气生效，抵挡攻击！剩余" + b.shieldCount + "次", 'buff');
                return false;
            }
            tempDefBoost = 10;
            addLog("🛡️ 金钟罩效果：防御临时+10", 'buff');
            return false;
        }
        if (b.name === '心魔') return true;
        return true;
    });

    var isCrit = Math.random() * 100 < getTotalCrit();
    var dmg = Math.max(1, getTotalAtk() - nowMonster.def - nowMonster.tempDefBoost);

    if (player.learnedSkills.indexOf("狂战") >= 0) {
        var hpPercent = player.hp / getTotalMaxHp();
        var berserkBonus = Math.floor((1 - hpPercent) * 10);
        if (berserkBonus > 0) {
            dmg += berserkBonus;
            addLog("🔥 狂战效果：攻击+" + berserkBonus, 'buff');
        }
    }

    if (player.learnedSkills.indexOf("处决") >= 0) {
        var monsterHpPercent = nowMonster.hp / nowMonster.maxHp;
        if (monsterHpPercent <= 0.3) {
            dmg = Math.floor(dmg * 1.5);
            addLog("⚔️ 处决触发！伤害+50%", 'buff');
        }
    }

    if (isCrit) dmg = Math.floor(dmg * 1.5);

    var playerSprite = document.getElementById('playerSprite');
    var monsterSprite = document.getElementById('monsterSprite');
    playerSprite.classList.remove('attack-right', 'damage');
    monsterSprite.classList.remove('attack-left', 'damage');
    void playerSprite.offsetWidth;
    playerSprite.classList.add('attack-right');
    setTimeout(function() {
        monsterSprite.classList.add('damage');
        setTimeout(function() { monsterSprite.classList.remove('damage'); }, getBattleDelay(300));
    }, getBattleDelay(150));

    nowMonster.hp -= dmg;
    addLog("⚔️ 你祭出法术攻击【" + nowMonster.name + "】，造成 <span class=\"damage\">" + dmg + "</span> 点伤害" + (isCrit ? ' <span class="crit">【暴击！】</span>' : ''));

    if (nowMonster.hp <= 0) {
        battleActive = false;
        monsterDefeated();
        return;
    }

    if (player.learnedSkills.indexOf("反击") >= 0) {
        var counterDmg = Math.floor(dmg * 0.2);
        nowMonster.hp -= counterDmg;
        addLog("� 反击！反弹 <span class=\"damage\">" + counterDmg + "</span> 点伤害");
        if (nowMonster.hp <= 0) {
            battleActive = false;
            monsterDefeated();
            return;
        }
    }

    if (petSummoned && player.pet) {
        var petDmg = Math.max(1, player.pet.atk + petEnergyBoost - nowMonster.def);
        nowMonster.hp -= petDmg;
        addLog("🐾 【" + player.pet.name + "】协助攻击，造成 " + petDmg + " 点伤害！");
        if (nowMonster.hp <= 0) {
            battleActive = false;
            monsterDefeated();
            return;
        }
    }

    scheduleNextAction();
}

function doMonsterAttack() {
    if (!battleActive || !nowMonster.name || nowMonster.hp <= 0 || player.hp <= 0) return;

    var playerTempDef = 0;
    var shieldBuff = player.buffs.find(function(b) { return b.name === '金钟罩' && b.shieldCount && b.shieldCount > 0; });
    if (shieldBuff) {
        shieldBuff.shieldCount--;
        if (shieldBuff.shieldCount <= 0) {
            player.buffs = player.buffs.filter(function(b) { return b.name !== '金钟罩'; });
            addLog("🛡️ 玄盾完全抵消了攻击！", 'buff');
        } else {
            addLog("🛡️ 玄盾生效，抵挡攻击！剩余" + shieldBuff.shieldCount + "次", 'buff');
        }
        scheduleNextAction();
        return;
    }

    if (Math.random() * 100 < getTotalDodge()) {
        var playerSprite = document.getElementById('playerSprite');
        if (playerSprite) {
            playerSprite.classList.add('evade');
            setTimeout(function() { playerSprite.classList.remove('evade'); }, getBattleDelay(400));
        }
        addLog("⚡ 你发动闪避，【" + nowMonster.name + "】的攻击落空！", 'dodge');
        scheduleNextAction();
        return;
    }

    var monsterDodge = nowMonster.highDodge || 0;
    if (Math.random() * 100 < monsterDodge) {
        addLog("【" + nowMonster.name + "】发动闪避，攻击落空！", 'dodge');
        scheduleNextAction();
        return;
    }

    var dmg = Math.max(1, nowMonster.atk - getTotalDef() - playerTempDef);
    player.hp -= dmg;
    var playerSprite = document.getElementById('playerSprite');
    var monsterSprite = document.getElementById('monsterSprite');
    monsterSprite.classList.remove('attack-left', 'damage');
    playerSprite.classList.remove('attack-right', 'damage');
    void monsterSprite.offsetWidth;
    monsterSprite.classList.add('attack-left');
    setTimeout(function() {
        playerSprite.classList.add('damage');
        setTimeout(function() { playerSprite.classList.remove('damage'); }, getBattleDelay(300));
    }, getBattleDelay(150));
    addLog("【" + nowMonster.name + "】攻击，你受到 <span class=\"damage\">" + dmg + "</span> 点伤害");

    if (player.hp <= 0) {
        var hasResurrection = player.buffs.some(function(b) { return b.name === '重生'; });
        if (hasResurrection) {
            player.hp = Math.floor(getTotalMaxHp() * 0.5);
            player.buffs = player.buffs.filter(function(b) { return b.name !== '重生'; });
            addLog("✨ 替身傀儡生效！你恢复" + Math.floor(getTotalMaxHp() * 0.5) + "点生机！", 'heal');
            updateUI();
            scheduleNextAction();
            return;
        }
        if (player.learnedSkills.indexOf("涅槃") >= 0 && !battleUsedSkills.secondLife) {
            player.hp = Math.floor(getTotalMaxHp() * 0.3);
            battleUsedSkills.secondLife = true;
            addLog("✨ 涅槃触发！你恢复" + Math.floor(getTotalMaxHp() * 0.3) + "点生机！", 'buff');
            updateUI();
            scheduleNextAction();
            return;
        }
        if (player.learnedSkills.indexOf("回元") >= 0 && !battleUsedSkills.secondWind) {
            player.hp = Math.floor(getTotalMaxHp() * 0.3);
            battleUsedSkills.secondWind = true;
            addLog("✨ 回元触发！你恢复" + Math.floor(getTotalMaxHp() * 0.3) + "点生机！", 'buff');
            updateUI();
            scheduleNextAction();
            return;
        }
        addLog("💀 你被斩灭了！身死道消，修为尽散...");
        consecutiveKills = 0;
        saveScore();
        battleActive = false;
        setTimeout(function() { location.reload(); }, 1500);
        return;
    }

    if (player.learnedSkills.indexOf("反击") >= 0) {
        var counterDmg = Math.floor(dmg * 0.2);
        nowMonster.hp -= counterDmg;
        addLog("🔄 反击！反弹 <span class=\"damage\">" + counterDmg + "</span> 点伤害");
        if (nowMonster.hp <= 0) {
            battleActive = false;
            monsterDefeated();
            return;
        }
    }

    processBuffs(nowMonster, false);
    if (player.learnedSkills.indexOf("不动如山") >= 0) {
        var fortressHeal = Math.floor(getTotalMaxHp() * 0.02);
        player.hp = Math.min(getTotalMaxHp(), player.hp + fortressHeal);
        addLog("🏰 不动如山效果：恢复 " + fortressHeal + " 点生机", 'heal');
    }

    updateUI();
    scheduleNextAction();
}

function scheduleNextAction() {
    if (!battleActive || !nowMonster.name) return;
    
    var playerSpeed = getTotalSpeed();
    var monsterSpeed = nowMonster.speed || 5;
    var speedDiff = battleNextAction === 'player' ? playerSpeed : monsterSpeed;
    var baseDelay = 1000;
    var delay = Math.max(200, baseDelay - speedDiff * 20) / gameSettings.battleSpeed;
    
    battleTimer = setTimeout(processAutoBattle, delay);
}

function monsterDefeated() {
    if (nowMonster.isTribulation) {
        completeTribulation();
        return;
    }

    var zone = zones[player.currentZone];
    addLog("【" + nowMonster.name + "】被斩灭！获得 <span class=\"gold\">" + nowMonster.exp + "修为、" + nowMonster.gold + "灵石</span>");

    var monsterKey = nowMonster.name + '_' + player.currentZone;
    if (!discoveredMonsters[monsterKey]) {
        discoveredMonsters[monsterKey] = { name: nowMonster.name, zone: player.currentZone, count: 1, firstDefeat: new Date().toLocaleDateString() };
        addLog("📖 妖兽图鉴更新：发现新妖兽【" + nowMonster.name + "】！", 'achievement');
    } else {
        discoveredMonsters[monsterKey].count++;
    }

    var goldBonus = nowMonster.gold;
    if (player.buffs.some(function(b) { return b.name === '福缘'; })) goldBonus = Math.floor(goldBonus * 1.5);

    if (Math.random() < 0.15) {
        var droppableItems = items.filter(function(i) { return ['healthPotion', 'attackScroll', 'defenseScroll'].indexOf(i.id) >= 0; });
        var randomItem = droppableItems[Math.floor(Math.random() * droppableItems.length)];
        addItemToInventory(randomItem.id);
        addLog("🎁 战利品：获得【" + randomItem.name + "】！", 'event');
    }

    player.qi += nowMonster.exp;
    player.spiritStones += goldBonus;
    totalGoldEarned += goldBonus;
    player.killCount++;
    zoneKills[player.currentZone]++;
    consecutiveKills++;

    if (player.pet) {
        var petData = pets.find(function(p) { return p.id === player.pet.id; });
        if (petData && petData.evolveReq) {
            petKillCount[player.pet.id] = (petKillCount[player.pet.id] || 0) + 1;
            if (petKillCount[player.pet.id] >= petData.evolveReq.kills) {
                var evolvedPet = pets.find(function(p) { return p.id === petData.evolveReq.petId; });
                if (evolvedPet) {
                    player.pet = { id: evolvedPet.id, name: evolvedPet.name, sprite: evolvedPet.sprite, atk: evolvedPet.atk, hp: evolvedPet.hp, def: evolvedPet.def, rarity: evolvedPet.rarity };
                    petKillCount[evolvedPet.id] = 0;
                    addLog("🌟 灵宠进化！【" + evolvedPet.name + "】诞生！", 'buff');
                }
            }
        }
    }

    if (zone.isBossZone && (nowMonster.name === '真龙' || nowMonster.name === '岩魔' || nowMonster.name === '影魔')) {
        player.bossDefeated++;
    }

    checkLevelUp();
    checkAchievements();
    updateQuests();

    if (player.disciples.length < 3 && Math.random() < 0.1) {
        var potentialDisciples = aiPlayers.filter(function(p) {
            return p.realm < player.realm && !p.isDisciple && !p.isMaster && !p.isPartner && p.id !== player.master.id && p.id !== player.partner.id;
        });
        if (potentialDisciples.length > 0) {
            var newDisciple = potentialDisciples[Math.floor(Math.random() * potentialDisciples.length)];
            player.disciples.push({ id: newDisciple.id, intimacy: 20 });
            newDisciple.isDisciple = true;
            addLog("<span class='buff'>🎉 战斗结束后，" + newDisciple.name + "被你的实力折服，愿拜你为师！</span>");
        }
    }

    var monsterSprite = document.getElementById('monsterSprite');
    if (monsterSprite) {
        monsterSprite.classList.add('death');
        setTimeout(function() {
            monsterSprite.classList.remove('death');
            nowMonster = { buffs: [] };
            updateUI();
        }, getBattleDelay(600));
    } else {
        nowMonster = { buffs: [] };
        updateUI();
    }
}

function completeTribulation() {
    var nextRealmIndex = player.breakthrough.nextRealmIndex;
    var nextRealm = realms[nextRealmIndex];

    player.realm = nextRealmIndex;
    player.stage = 1;
    player.realmName = nextRealm.name;

    var multiplier = nextRealm.multiplier;
    player.maxHp += Math.floor(20 * multiplier);
    player.hp = player.maxHp;
    player.atk += Math.floor(5 * multiplier);
    player.def += Math.floor(2 * multiplier);
    player.skillPoints++;
    player.needQi = Math.floor(player.needQi * 1.5);

    player.qi += nowMonster.exp;
    player.spiritStones += nowMonster.gold;

    addLog("<span class='levelup'>🎉 渡劫成功！踏入" + nextRealm.name + "！</span>");
    addLog("<span class='gold'>⚡ 获得天劫馈赠：" + nowMonster.exp + "修为、" + nowMonster.gold + "灵石</span>");

    player.breakthrough = { inProgress: false, type: null, progress: 0, required: 0 };

    var playerSprite = document.getElementById('playerSprite');
    if (playerSprite) {
        playerSprite.classList.add('levelup');
        setTimeout(function() { playerSprite.classList.remove('levelup'); }, getBattleDelay(800));
    }

    checkAchievements();
    updateQuests();

    var monsterSprite = document.getElementById('monsterSprite');
    if (monsterSprite) {
        monsterSprite.classList.add('death');
        setTimeout(function() {
            monsterSprite.classList.remove('death');
            nowMonster = { buffs: [] };
            updateUI();
        }, getBattleDelay(600));
    } else {
        nowMonster = { buffs: [] };
        updateUI();
    }
}

function checkLevelUp() {
    if (player.qi < player.needQi) return;
    if (player.breakthrough.inProgress) return;

    player.qi -= player.needQi;
    var currentRealm = realms[player.realm];
    var nextStage = player.stage + 1;
    var isRealmBreakthrough = nextStage > currentRealm.stages;
    var nextRealmIndex = isRealmBreakthrough ? player.realm + 1 : player.realm;

    if (isRealmBreakthrough && nextRealmIndex >= realms.length) {
        player.realm = realms.length - 1;
        player.stage = currentRealm.stages;
        addLog("<span class=\"levelup\">🎉恭喜道友飞升成仙！</span>");
        return;
    }

    var nextRealm = isRealmBreakthrough ? realms[nextRealmIndex] : currentRealm;

    if (isRealmBreakthrough && nextRealm.needTribulation) {
        startTribulation(nextRealmIndex);
        return;
    }

    if (isBottleneckStage(nextStage) && !isRealmBreakthrough) {
        startBottleneckBreakthrough(nextStage);
        return;
    }

    attemptBreakthrough(isRealmBreakthrough, nextRealmIndex);
}

function startTribulation(nextRealmIndex) {
    var nextRealm = realms[nextRealmIndex];
    player.breakthrough = {
        inProgress: true,
        type: 'tribulation',
        progress: 0,
        required: 1,
        nextRealmIndex: nextRealmIndex
    };

    var tribulationData = getTribulationDifficulty(nextRealmIndex);
    nowMonster = {
        name: nextRealm.tribulationName,
        sprite: "⚡",
        hp: tribulationData.hp,
        maxHp: tribulationData.hp,
        atk: tribulationData.atk,
        def: tribulationData.def,
        speed: tribulationData.speed,
        exp: tribulationData.exp,
        gold: tribulationData.gold,
        type: "天劫",
        isTribulation: true,
        buffs: []
    };

    battleActive = true;
    addLog("<span class='levelup'>⚡ " + nextRealm.tribulationName + "降临！战胜天劫方可突破！</span>");
    updateUI();
}

function startBottleneckBreakthrough(nextStage) {
    player.breakthrough = {
        inProgress: true,
        type: 'bottleneck',
        progress: 0,
        required: 3,
        nextStage: nextStage
    };

    var successRate = getBreakthroughSuccessRate(player.realm, nextStage, false);
    addLog("<span class='levelup'>🌀 遭遇瓶颈！第" + nextStage + "层突破成功率：" + successRate + "%</span>");
    addLog("<span class='buff'>💡 点击【突破瓶颈】按钮尝试突破（需要消耗修为）</span>");
    updateUI();
}

function attemptBreakthrough(isRealmBreakthrough, nextRealmIndex) {
    var currentRealm = realms[player.realm];
    var nextRealm = isRealmBreakthrough ? realms[nextRealmIndex] : currentRealm;
    var nextStage = isRealmBreakthrough ? 1 : player.stage + 1;
    var successRate = getBreakthroughSuccessRate(player.realm, nextStage, isRealmBreakthrough);

    if (Math.random() * 100 < successRate) {
        if (isRealmBreakthrough) {
            player.realm = nextRealmIndex;
            player.stage = 1;
            player.realmName = nextRealm.name;
            addLog("<span class='levelup'>🎉 突破成功！踏入" + nextRealm.name + "！</span>");
        } else {
            player.stage = nextStage;
            addLog("<span class='levelup'>🎉 突破成功！" + nextRealm.name + "第" + player.stage + "层！</span>");
        }

        var multiplier = nextRealm.multiplier;
        player.maxHp += Math.floor(20 * multiplier);
        player.hp = Math.min(player.hp + Math.floor(20 * multiplier), player.maxHp);
        player.atk += Math.floor(5 * multiplier);
        player.def += Math.floor(2 * multiplier);
        player.skillPoints++;
        player.needQi = Math.floor(player.needQi * 1.5);

        var playerSprite = document.getElementById('playerSprite');
        if (playerSprite) {
            playerSprite.classList.add('levelup');
            setTimeout(function() { playerSprite.classList.remove('levelup'); }, getBattleDelay(800));
        }
    } else {
        var qiLoss = Math.floor(player.needQi * 0.3);
        player.qi = Math.max(0, player.qi - qiLoss);
        addLog("<span class='debuff'>💔 突破失败！修为反噬，损失" + qiLoss + "修为</span>");

        if (Math.random() < 0.3) {
            var hpLoss = Math.floor(player.maxHp * 0.1);
            player.hp = Math.max(1, player.hp - hpLoss);
            addLog("<span class='damage'>💀 经脉受损！生机减少" + hpLoss + "点</span>");
        }
    }

    player.breakthrough = { inProgress: false, type: null, progress: 0, required: 0 };
    updateZoneButtons();
    updateUI();
}

function tryBottleneckBreakthrough() {
    if (!player.breakthrough.inProgress || player.breakthrough.type !== 'bottleneck') {
        return addLog("当前没有瓶颈需要突破！");
    }

    if (player.qi < player.needQi * 0.5) {
        return addLog("修为不足！需要" + Math.floor(player.needQi * 0.5) + "修为才能尝试突破");
    }

    player.qi -= Math.floor(player.needQi * 0.5);
    player.breakthrough.progress++;

    var nextStage = player.breakthrough.nextStage;
    var successRate = getBreakthroughSuccessRate(player.realm, nextStage, false);
    var attemptBonus = player.breakthrough.progress * 5;
    var finalRate = Math.min(95, successRate + attemptBonus);

    addLog("<span class='buff'>🌀 第" + player.breakthrough.progress + "次尝试突破...成功率：" + finalRate + "%</span>");

    if (Math.random() * 100 < finalRate) {
        player.stage = nextStage;
        var currentRealm = realms[player.realm];
        addLog("<span class='levelup'>🎉 突破成功！" + currentRealm.name + "第" + player.stage + "层！</span>");

        var multiplier = currentRealm.multiplier;
        player.maxHp += Math.floor(20 * multiplier);
        player.hp = Math.min(player.hp + Math.floor(20 * multiplier), player.maxHp);
        player.atk += Math.floor(5 * multiplier);
        player.def += Math.floor(2 * multiplier);
        player.skillPoints++;
        player.needQi = Math.floor(player.needQi * 1.5);

        player.breakthrough = { inProgress: false, type: null, progress: 0, required: 0 };

        var playerSprite = document.getElementById('playerSprite');
        if (playerSprite) {
            playerSprite.classList.add('levelup');
            setTimeout(function() { playerSprite.classList.remove('levelup'); }, getBattleDelay(800));
        }
    } else {
        addLog("<span class='debuff'>💔 突破失败！再接再厉！</span>");

        if (player.breakthrough.progress >= player.breakthrough.required) {
            addLog("<span class='buff'>✨ 多次尝试后终于突破！" + realms[player.realm].name + "第" + nextStage + "层！</span>");
            player.stage = nextStage;
            var multiplier = realms[player.realm].multiplier;
            player.maxHp += Math.floor(20 * multiplier);
            player.hp = Math.min(player.hp + Math.floor(20 * multiplier), player.maxHp);
            player.atk += Math.floor(5 * multiplier);
            player.def += Math.floor(2 * multiplier);
            player.skillPoints++;
            player.needQi = Math.floor(player.needQi * 1.5);
            player.breakthrough = { inProgress: false, type: null, progress: 0, required: 0 };
        }
    }

    updateZoneButtons();
    updateUI();
}

function useSkill(index) {
    if (!nowMonster.name || !battleActive) return addLog("请先寻找妖兽并进入斗法！");
    var skill = player.skills[index];
    if (!skill.isReady) return addLog(skill.name + "调息中！");

    skill.isReady = false;
    skill.cd = skill.maxCd;

    if (index === 0) {
        var isCrit = Math.random() * 100 < getTotalCrit();
        var dmg = Math.max(1, Math.floor(getTotalAtk() * 1.5) - nowMonster.def);
        if (isCrit) dmg = Math.floor(dmg * 1.5);
        nowMonster.hp -= dmg;
        var monsterSprite = document.getElementById('monsterSprite');
        monsterSprite.classList.add('skill-burst');
        setTimeout(function() { monsterSprite.classList.remove('skill-burst'); }, getBattleDelay(400));
        addLog("💥 使用【破山击】！造成 <span class=\"damage\">" + dmg + "</span> 点伤害" + (isCrit ? ' <span class="crit">【暴击！】</span>' : ''));

        if (player.learnedSkills.indexOf("双重打击") >= 0 && nowMonster.hp > 0) {
            var isCrit2 = Math.random() * 100 < getTotalCrit();
            var dmg2 = Math.max(1, getTotalAtk() - nowMonster.def);
            if (isCrit2) dmg2 = Math.floor(dmg2 * 1.5);
            nowMonster.hp -= dmg2;
            addLog("⚔️ 双重打击！追加 <span class=\"damage\">" + dmg2 + "</span> 点伤害");
        }
    } else if (index === 1) {
        var shieldBlockCount = 1;
        if (player.learnedSkills.indexOf("玄盾") >= 0) shieldBlockCount = 2;
        player.buffs.push({
            name: '金钟罩',
            type: 'buff',
            turns: 2,
            shieldCount: shieldBlockCount,
            onApply: function() { addLog("🛡️ 进入金钟罩姿态，可抵挡" + shieldBlockCount + "次攻击", 'buff'); }
        });
        var playerSprite = document.getElementById('playerSprite');
        playerSprite.classList.add('shield-glow');
        setTimeout(function() { playerSprite.classList.remove('shield-glow'); }, getBattleDelay(600));
        addLog("🛡️ 使用【金钟罩】！获得护体罡气，可抵挡" + shieldBlockCount + "次攻击", 'buff');
    } else if (index === 2) {
        addLog("⚔️ 使用【连击】！");
        var isCrit = Math.random() * 100 < getTotalCrit();
        var dmg = Math.max(1, getTotalAtk() - nowMonster.def);
        if (isCrit) dmg = Math.floor(dmg * 1.5);
        nowMonster.hp -= dmg;
        addLog("⚔️ 第1次攻击，造成 <span class=\"damage\">" + dmg + "</span> 点伤害");
        if (nowMonster.hp <= 0) {
            battleActive = false;
            monsterDefeated();
            return;
        }
        if (nowMonster.hp > 0) {
            var isCrit2 = Math.random() * 100 < getTotalCrit();
            var dmg2 = Math.max(1, getTotalAtk() - nowMonster.def);
            if (isCrit2) dmg2 = Math.floor(dmg2 * 1.5);
            nowMonster.hp -= dmg2;
            addLog("⚔️ 第2次攻击，造成 <span class=\"damage\">" + dmg2 + "</span> 点伤害");
            if (nowMonster.hp <= 0) {
                battleActive = false;
                monsterDefeated();
                return;
            }
        }
    }

    if (nowMonster.hp <= 0) {
        battleActive = false;
        monsterDefeated();
        return;
    }

    updateSkillCooldowns();
    updateUI();
    battleNextAction = 'monster';
    scheduleNextAction();
}

function updateSkillCooldowns() {
    player.skills.forEach(function(skill) {
        if (!skill.isReady) {
            skill.cd--;
            if (skill.cd <= 0) {
                skill.isReady = true;
                addLog("⚡ 神通【" + skill.name + "】调息完毕！", 'buff');
            }
        }
    });
}

function processBuffs(creature, isPlayer) {
    creature.buffs = creature.buffs.filter(function(b) {
        b.turns--;
        if (b.onTurnEnd) b.onTurnEnd(creature, isPlayer);
        return b.turns > 0;
    });
}

function heal() {
    var cost = 5;
    var healAmount = 30;
    if (player.spiritStones < cost) return addLog("灵石不足，无法服用丹药！");
    player.spiritStones -= cost;
    player.hp = Math.min(getTotalMaxHp(), player.hp + healAmount);
    addLog("❤️ 消耗" + cost + "灵石，恢复" + healAmount + "点生机");
    updateUI();
}

function run() {
    if (battleTimer) clearTimeout(battleTimer);
    battleActive = false;
    consecutiveKills = 0;
    if (nowMonster.name && Math.random() < 0.5) {
        addLog("🏃 遁走失败！被妖兽追上！");
        battleActive = true;
        battleNextAction = 'monster';
        scheduleNextAction();
        return;
    }
    nowMonster = { buffs: [] };
    addLog("🏃 成功遁走！");
    updateUI();
}

function triggerRandomEvent() {
    if (currentEvent) {
        addLog("当前有未处理的奇遇！", 'debuff');
        return;
    }
    var event = randomEvents[Math.floor(Math.random() * randomEvents.length)];
    currentEvent = event;
    player.eventCount++;
    checkAchievements();

    var eventBtns = document.getElementById('eventBtns');
    var confirmBtn = document.getElementById('eventConfirmBtn');
    var currentEventDiv = document.getElementById('currentEvent');

    currentEventDiv.innerHTML = "<span style=\"color:#34d399;\">🎭 " + event.name + "</span>：" + event.desc;
    eventBtns.style.display = 'flex';

    if (event.type === 'danger') {
        confirmBtn.innerText = '硬抗';
        confirmBtn.style.background = '#dc2626';
        eventBtns.style.display = 'flex';
    } else {
        confirmBtn.innerText = '确认';
        confirmBtn.style.background = '#2563eb';
    }

    addLog("🎲 触发奇遇【" + event.name + "】：" + event.desc, 'event');
}

function confirmEvent() {
    if (!currentEvent) return;
    currentEvent.effect();
    checkAchievements();
    clearEvent();
    updateUI();
}

function cancelEvent() {
    if (!currentEvent) return;
    if (currentEvent.type === 'danger') {

function openEquipShop() {
    var shopText = "=== 装备坊市 ===\n";
    shopText += "\n【攻击法宝】\n";
    equipPool.weapon.forEach(function(item, i) {
        var equipped = player.equipment.weapon && player.equipment.weapon.name === item.name;
        shopText += (i + 1) + ". " + item.name + " | 攻击+" + item.atk + (item.crit ? " 暴击+" + item.crit + "%" : "") + " | " + item.price + "灵石 " + (equipped ? "[已装备]" : "") + "\n";
    });
    shopText += "\n【防御法宝】\n";
    equipPool.armor.forEach(function(item, i) {
        var equipped = player.equipment.armor && player.equipment.armor.name === item.name;
        shopText += (i + 1) + ". " + item.name + " | 防御+" + item.def + (item.hp ? " 生机+" + item.hp : "") + (item.dodge ? " 闪避+" + item.dodge + "%" : "") + " | " + item.price + "灵石 " + (equipped ? "[已装备]" : "") + "\n";
    });
    shopText += "\n【灵饰】\n";
    equipPool.accessory.forEach(function(item, i) {
        var equipped = player.equipment.accessory && player.equipment.accessory.name === item.name;
        shopText += (i + 1) + ". " + item.name + " | " + (item.atk ? "攻击+" + item.atk + " " : "") + (item.def ? "防御+" + item.def + " " : "") + (item.crit ? "暴击+" + item.crit + "% " : "") + (item.dodge ? "闪避+" + item.dodge + "% " : "") + (item.hp ? "生机+" + item.hp + " " : "") + "| " + item.price + "灵石 " + (equipped ? "[已装备]" : "") + "\n";
    });
    shopText += "\n输入格式: w1=攻击法宝1, a1=防御法宝1, ac1=灵饰1";
    shopText += "\n输入 s1/s2/s3 出售装备";

    var tip = prompt(shopText);
    if (!tip) return;

    var input = tip.toLowerCase().trim();
    if (input.startsWith('s')) {
        sellEquip(input.substring(1));
        return;
    }

    var type, idx;
    if (input.startsWith('w')) {
        type = 'weapon'; idx = parseInt(input.substring(1)) - 1;
    } else if (input.startsWith('a')) {
        if (input.startsWith('ac')) {
            type = 'accessory'; idx = parseInt(input.substring(2)) - 1;
        } else {
            type = 'armor'; idx = parseInt(input.substring(1)) - 1;
        }
    } else {
        addLog("输入格式错误！");
        return;
    }

    buyEquip(type, idx);
}

function buyEquip(type, idx) {
    var pool = equipPool[type];
    if (idx < 0 || idx >= pool.length) return addLog("选择错误！");
    var item = pool[idx];
    if (player.spiritStones < item.price) return addLog("灵石不足！");
    if (player.equipment[type] && player.equipment[type].price) {
        var sellPrice = Math.floor(player.equipment[type].price * 0.5);
        player.spiritStones += sellPrice;
        addLog("💰 出售旧法宝，获得" + sellPrice + "灵石");
    }
    player.spiritStones -= item.price;
    player.equipment[type] = { name: item.name, atk: item.atk, def: item.def, crit: item.crit, dodge: item.dodge, hp: item.hp, maxHp: item.maxHp, price: item.price };
    player.hp = Math.min(player.hp, getTotalMaxHp());
    addLog("✅ 购买【" + item.name + "】成功！");
    updateUI();
}

function sellEquip(idx) {
    var typeMap = { '1': 'weapon', '2': 'armor', '3': 'accessory' };
    var type = typeMap[idx];
    if (!type || !player.equipment[type]) return addLog("没有可出售的装备！");
    var item = player.equipment[type];
    var sellPrice = Math.floor(item.price * 0.5);
    player.spiritStones += sellPrice;
    if (item.maxHp) {
        player.maxHp -= item.maxHp;
        player.hp = Math.min(player.hp, player.maxHp);
    }
    player.equipment[type] = null;
    addLog("💰 出售【" + item.name + "】，获得" + sellPrice + "灵石");
    updateUI();
}

}

function loadGame(slot) {
    var saves = JSON.parse(localStorage.getItem('rpgSaves') || '[]');
    if (!saves[slot]) return addLog("存档为空！");

    var data = saves[slot].data;
    Object.assign(player, data.player);
    nowMonster = data.nowMonster || { buffs: [] };
    currentEvent = data.currentEvent;
    consecutiveKills = data.consecutiveKills;
    zoneKills = data.zoneKills;
    totalGoldEarned = data.totalGoldEarned;
    questCompleted = data.questCompleted;
    if (data.quests) { quests.length = 0; quests.push.apply(quests, data.quests); }
    if (data.achievements) { achievements.length = 0; achievements.push.apply(achievements, data.achievements); }
    if (data.inventory) { inventory.length = 0; inventory.push.apply(inventory, data.inventory); }
    if (data.petInventory) { petInventory.length = 0; petInventory.push.apply(petInventory, data.petInventory); }
    if (data.petKillCount) Object.assign(petKillCount, data.petKillCount);
    if (data.discoveredMonsters) Object.assign(discoveredMonsters, data.discoveredMonsters);
    if (data.gameSettings) Object.assign(gameSettings, data.gameSettings);
    if (data.storyChapters) { storyChapters.length = 0; storyChapters.push.apply(storyChapters, data.storyChapters); }
    if (data.completedTutorials) { completedTutorials = data.completedTutorials; }
    if (data.currentDungeon) currentDungeon = data.currentDungeon;
    if (data.currentDungeonFloor) currentDungeonFloor = data.currentDungeonFloor;

    addLog("📂 从 " + (slot + 1) + "号位读取存档成功！", 'event');
    closeModal();
    updateUI();
    updateQuests();
    updateAchievements();
}

function useItem(itemId) {
    var invItem = inventory.find(function(i) { return i.id === itemId; });
    if (!invItem || invItem.count <= 0) return addLog("道具不存在或数量不足！");

    var itemData = items.find(function(i) { return i.id === itemId; });
    if (!itemData) return;

    if (itemData.id === 'goldCoin' || itemData.id === 'critCrystal' || itemData.id === 'resurrectionScroll') {
        var success = itemData.effect();
        if (success) {
            invItem.count--;
            if (invItem.count <= 0) inventory.splice(inventory.findIndex(function(i) { return i.id === itemId; }), 1);
            addLog("✨ 使用【" + itemData.name + "】成功！", 'event');
        } else {
            addLog(itemData.name + " 使用失败！", 'debuff');
        }
    } else {
        var success = itemData.effect();
        if (success) {
            invItem.count--;
            if (invItem.count <= 0) inventory.splice(inventory.findIndex(function(i) { return i.id === itemId; }), 1);

function getRarityChance(rarity) {
    var chances = { common: 60, rare: 25, epic: 12, legend: 3 };
    return chances[rarity] || 10;
}

function getRandomPet() {
    var playerZone = player.currentZone;
    var basePets = pets.filter(function(p) { return p.evolveReq && p.zone <= playerZone; });
    var totalChance = 0;
    basePets.forEach(function(p) { totalChance += getRarityChance(p.rarity); });
    var rand = Math.random() * totalChance;
    var cumulative = 0;
    for (var i = 0; i < basePets.length; i++) {
        cumulative += getRarityChance(basePets[i].rarity);
        if (rand <= cumulative) return basePets[i];
    }
    return basePets[basePets.length - 1];
}

function petGacha(count) {
    var cost = count * 10;
    if (player.spiritStones < cost) { addLog("灵石不足！"); return; }
    player.spiritStones -= cost;
    var results = [];
    for (var i = 0; i < count; i++) {
        var pet = getRandomPet();
        var isNew = !petInventory.some(function(p) { return p.id === pet.id; });
        if (isNew) {
            petInventory.push({ id: pet.id, name: pet.name, sprite: pet.sprite, atk: pet.atk, hp: pet.hp, def: pet.def, rarity: pet.rarity, count: 1 });
        } else {
            var existingPet = petInventory.find(function(p) { return p.id === pet.id; });
            existingPet.count++;
            var fruitValue = pet.rarity === 'common' ? 1 : pet.rarity === 'rare' ? 2 : pet.rarity === 'epic' ? 5 : pet.rarity === 'legend' ? 10 : 1;
            for (var j = 0; j < fruitValue; j++) {

            }
            addLog("🔄 重复灵宠【" + pet.name + "】炼化为" + fruitValue + "个🍎灵宠丹！", 'event');
        }
        results.push({ pet: pet, isNew: isNew });
    }
    var resultDiv = document.getElementById('gachaResult');
    var html = "<h3>召唤结果:</h3><div style='display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px;'>";
    results.forEach(function(r) {

var meditationTimer = null;
var meditationInterval = null;

function toggleMeditation() {
    if (player.meditation.active) {
        stopMeditation();
    } else {
        startMeditation();
    }
}

function startMeditation() {
    if (battleActive) {
        addLog("⚠️ 斗法中无法打坐！");
        return;
    }
    if (player.breakthrough.inProgress) {
        addLog("⚠️ 突破中无法打坐！");
        return;
    }

    player.meditation.active = true;
    player.meditation.startTime = Date.now();
    player.meditation.totalGain = 0;

    var btn = document.getElementById('meditationBtn');
    btn.textContent = "🧘 停止打坐";
    btn.style.background = "#ef4444";

    addLog("<span class='buff'>🧘 开始打坐修炼，每5秒获得修为...</span>");

    meditationInterval = setInterval(function() {
        if (!player.meditation.active) return;

        var realmMultiplier = realms[player.realm].multiplier;
        var stageBonus = player.stage * 0.1;
        var baseGain = 5;
        var totalGain = Math.floor(baseGain * realmMultiplier * (1 + stageBonus));

        var spiritPoolLevel = player.residence.spiritPool;
        if (spiritPoolLevel > 0) {
            var building = residenceBuildings.find(function(b) { return b.key === 'spiritPool'; });
            var poolBonus = building.meditationBonus[spiritPoolLevel - 1] || 0;
            totalGain = Math.floor(totalGain * (1 + poolBonus));
        }

        if (player.sect.id) {
            var sect = sects.find(function(s) { return s.id === player.sect.id; });
            var rankData = sectRanks.find(function(r) { return r.name === player.sect.rank; });
            if (sect && sect.benefits.expBonus) totalGain = Math.floor(totalGain * (1 + sect.benefits.expBonus * rankData.benefit));
        }

        if (player.master.id) totalGain = Math.floor(totalGain * (1 + masterBenefits.expBonus));
        if (player.disciples.length > 0) totalGain = Math.floor(totalGain * (1 + discipleBenefits.expBonus * Math.min(player.disciples.length, 3)));
        if (player.partner.id) totalGain = Math.floor(totalGain * (1 + partnerBenefits.expBonus));

        var rootBonus = getSpiritRootBonus();
        totalGain = Math.floor(totalGain * (1 + rootBonus.qiBonus));

        player.qi += totalGain;
        player.meditation.totalGain += totalGain;

        addLog("🧘 打坐修炼，获得 " + totalGain + " 修为 (总计: " + player.meditation.totalGain + ")");

        checkLevelUp();
        updateUI();
    }, 5000);

    updateUI();
}

function stopMeditation() {
    player.meditation.active = false;

    if (meditationInterval) {
        clearInterval(meditationInterval);
        meditationInterval = null;
    }

    var btn = document.getElementById('meditationBtn');
    btn.textContent = "🧘 打坐修炼";
    btn.style.background = "#3b82f6";

    if (player.meditation.totalGain > 0) {
        addLog("<span class='buff'>🧘 结束打坐，本次共获得 " + player.meditation.totalGain + " 修为</span>");
    }

    player.meditation.startTime = null;
    player.meditation.totalGain = 0;

    updateUI();
}

    mHpBar.style.width = mHpPercent + '%';
    mHpBar.className = 'hp-bar-fill';

    else if (mHpPercent < 50) mHpBar.classList.add('mid');

function checkDailyReset() {
    var now = Date.now();
    var lastReset = player.sect.lastDailyReset;
    if (now - lastReset > 24 * 60 * 60 * 1000) {
        player.sect.dailyQuestsCompleted = 0;
        player.sect.lastDailyReset = now;
    }
}

function completeSectQuest(questIndex) {
    var quest = sectQuests[questIndex];
    if (!quest) return;

    var rankData = sectRanks.find(function(r) { return r.name === player.sect.rank; });
    if (player.sect.dailyQuestsCompleted >= rankData.dailyQuests) {
        return addLog("今日任务已完成！");
    }

    player.sect.dailyQuestsCompleted++;
    player.sect.contribution += quest.reward.contribution;
    player.qi += quest.reward.exp;
    player.spiritStones += quest.reward.gold;

    addLog("<span class='quest'>📜 完成宗门任务【" + quest.name + "】！贡献+" + quest.reward.contribution + "</span>");

    checkSectRankUp();
    checkLevelUp();
    updateUI();
    openSect();
}

function checkSectRankUp() {
    for (var i = sectRanks.length - 1; i >= 0; i--) {
        if (player.sect.contribution >= sectRanks[i].contribution && player.sect.rank !== sectRanks[i].name) {
            if (sectRanks.findIndex(function(r) { return r.name === player.sect.rank; }) < i) {
                player.sect.rank = sectRanks[i].name;
                addLog("<span class='levelup'>🎉 宗门地位提升！成为" + player.sect.rank + "！</span>");
                break;
            }
        }
    }
}

function leaveSect() {
    if (!confirm("确定要退出" + player.sect.name + "吗？贡献值将清零！")) return;

    addLog("<span class='debuff'>🏛️ 退出" + player.sect.name + "，贡献值清零</span>");
    player.sect = { id: null, name: null, contribution: 0, rank: "外门弟子", dailyQuestsCompleted: 0, lastDailyReset: 0 };
    closeModal();
    updateUI();
}

        if (building.key === 'spiritField') {
            var production = building.production[currentLevel - 1] || 0;
            html += "<div style='font-size:10px;color:#4ade80;'>每小时产出: " + production + "灵石</div>";
        } else if (building.key === 'alchemyRoom') {
            var bonus = building.bonus[currentLevel - 1] || 0;
            html += "<div style='font-size:10px;color:#4ade80;'>炼丹成功率: +" + bonus + "%</div>";
        } else if (building.key === 'forgeRoom') {
            var bonus = building.bonus[currentLevel - 1] || 0;
            html += "<div style='font-size:10px;color:#4ade80;'>炼器成功率: +" + bonus + "%</div>";
        } else if (building.key === 'spiritPool') {
            var regen = building.regen[currentLevel - 1] || 0;
            var medBonus = building.meditationBonus[currentLevel - 1] || 0;
            html += "<div style='font-size:10px;color:#4ade80;'>每小时恢复: " + regen + "生机 | 打坐收益: +" + Math.floor(medBonus * 100) + "%</div>";
        }

        html += "</div>";

        if (!isMax) {
            html += "<button onclick='upgradeResidence(\"" + building.key + "\")' style='padding:6px 12px;font-size:11px;background:#22c55e;'" + (player.spiritStones < building.costs[currentLevel] ? " disabled" : "") + ">升级</button>";
        }

        html += "</div></div>";
    });

    var offlineGain = calculateOfflineGain();
    if (offlineGain > 0) {
        html += "<div style='background:#333;padding:10px;border-radius:6px;margin:10px 0;text-align:center;'>";
        html += "<div style='color:#4ade80;font-size:14px;'>💰 离线收益: " + offlineGain + "灵石</div>";
        html += "<div style='font-size:11px;color:#aaa;'>灵田自动产出</div>";
        html += "<button onclick='collectOfflineGain()' style='margin-top:8px;background:#f59e0b;'>领取收益</button>";
        html += "</div>";
    }

    html += "<button onclick='closeModal()' style='margin-top:15px;'>关闭</button>";
    content.innerHTML = html;
}

function upgradeResidence(buildingKey) {
    var building = residenceBuildings.find(function(b) { return b.key === buildingKey; });
    if (!building) return;

    var currentLevel = player.residence[buildingKey];
    var maxLevel = building.costs.length;

    if (currentLevel >= maxLevel) return addLog("已达最高等级！");

    var cost = building.costs[currentLevel];
    if (player.spiritStones < cost) return addLog("灵石不足！");

    player.spiritStones -= cost;
    player.residence[buildingKey]++;

    addLog("<span class='buff'>🏠 " + building.name + "升级到Lv." + player.residence[buildingKey] + "！</span>");
    updateUI();
    openResidence();
}

function calculateOfflineGain() {
    var lastCollect = player.residence.lastCollect;
    var now = Date.now();
    var hoursPassed = (now - lastCollect) / (1000 * 60 * 60);
    var spiritFieldLevel = player.residence.spiritField;
    if (spiritFieldLevel <= 0) return 0;

    var building = residenceBuildings.find(function(b) { return b.key === 'spiritField'; });
    var production = building.production[spiritFieldLevel - 1] || 0;
    return Math.floor(production * hoursPassed);
}

function collectOfflineGain() {
    var gain = calculateOfflineGain();
    if (gain <= 0) return;

    player.spiritStones += gain;
    player.residence.lastCollect = Date.now();

    addLog("<span class='gold'>💰 领取洞府收益: " + gain + "灵石</span>");
    updateUI();
    openResidence();
}
